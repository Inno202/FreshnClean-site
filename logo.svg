<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3BA9F5" />
      <stop offset="60%" stop-color="#1D5FD6" />
      <stop offset="100%" stop-color="#0B2A6F" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B2A6F" />
      <stop offset="50%" stop-color="#1D5FD6" />
      <stop offset="100%" stop-color="#3BA9F5" />
    </linearGradient>
  </defs>

  <!-- Circular Swirl / Washing Machine Wave Motif -->
  <g transform="translate(250, 190)">
    <!-- Outer swirl arc -->
    <path d="M 0 -130 A 130 130 0 1 1 -125 40 A 110 110 0 0 0 0 -95 A 95 95 0 1 0 95 0 C 95 -60 45 -110 0 -130 Z" fill="url(#blueGrad)" />
    <!-- Dynamic Wave curves -->
    <path d="M -70 20 C -40 -30 20 -40 70 -10 C 110 15 80 70 30 75 C -30 80 -60 50 -70 20 Z" fill="url(#waveGrad)" opacity="0.9" />
    <path d="M -90 40 C -50 75 10 90 60 70 C 10 95 -60 90 -90 40 Z" fill="#3BA9F5" />
    
    <!-- Bubbles & Sparkles -->
    <circle cx="55" cy="-80" r="14" fill="#3BA9F5" />
    <circle cx="85" cy="-55" r="9" fill="#1D5FD6" />
    <circle cx="35" cy="-105" r="7" fill="#3BA9F5" opacity="0.8" />
    <!-- Star sparkle -->
    <path d="M 25 -135 Q 25 -125 35 -125 Q 25 -125 25 -115 Q 25 -125 15 -125 Q 25 -125 25 -135 Z" fill="#3BA9F5" />
  </g>

  <!-- Typography -->
  <!-- Fresh N Clean -->
  <text x="250" y="380" font-family="'Poppins', sans-serif" font-size="44" font-weight="700" fill="#0B2A6F" text-anchor="middle" letter-spacing="-0.5">
    Fresh <tspan fill="#1D5FD6">N</tspan> Clean
  </text>
  
  <!-- Subtitle: — LAUNDRY — -->
  <g transform="translate(250, 420)">
    <line x1="-140" y1="-6" x2="-85" y2="-6" stroke="#0B2A6F" stroke-width="3" stroke-linecap="round" />
    <text x="0" y="0" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#0B2A6F" text-anchor="middle" letter-spacing="6">
      LAUNDRY
    </text>
    <line x1="85" y1="-6" x2="140" y2="-6" stroke="#0B2A6F" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
